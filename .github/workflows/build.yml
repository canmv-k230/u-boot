name: Build Prebuilt u-boot

on:
  push:
    branches:
      - canmv_k230
      - action

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup SSH
        run: |
          git config --global user.name kendryte747
          git config --global user.email kendryte747@gmail.com
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex gcc libncurses5-dev \
            libssl-dev pkg-config python3 python3-pip python-is-python3 python3-venv curl git
          python3 -m venv ~/.canmv_venv
          source ~/.canmv_venv/bin/activate
          pip3 install pycryptodome gmssl jsonschema jinja2

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init repo
        run: |
          mkdir ${{ github.workspace }}/canmv_k230
          cd ${{ github.workspace }}/canmv_k230
          repo init -u https://github.com/canmv-k230/manifest \
                    -b master \
                    --repo-url=https://github.com/canmv-k230/git-repo.git \
                    --repo-branch stable

      - name: Sync repo
        run: |
          cd ${{ github.workspace }}/canmv_k230
          repo sync -j$(nproc)

      - name: Get Git revision and set as environment variable
        id: get_revision
        run: |
          cd ${{ github.workspace }}/canmv_k230/src/uboot/uboot
          revision=$(git describe --long --tag --dirty --always)
          echo "REVISION=$revision" >> $GITHUB_ENV

      - name: Cache RISC-V Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kendryte/Xuantie-900-gcc-linux-5.10.4-glibc-x86_64-V2.6.0/
          key: k230-toolchain-v2.6.0

      - name: Download toolchains
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.kendryte
          wget -q https://github.com/kendryte/canmv_k230/releases/download/v1.1/Xuantie-900-gcc-linux-5.10.4-glibc-x86_64-V2.6.0.tar.bz2 -O /tmp/toolchain.tar.bz2
          tar -xjf /tmp/toolchain.tar.bz2 -C ~/.kendryte
          ls -alth ~/.kendryte

      - name: Build Prebuilt u-boot
        run: |
          cd ${{ github.workspace }}/canmv_k230
          mkdir -p ~/artifacts
          source ~/.canmv_venv/bin/activate

          defconfigs=(
            k230_rtos_aihardware_defconfig
            k230_canmv_v1p0p1_defconfig
            k230_canmv_01studio_defconfig
            k230_canmv_dongshanpi_defconfig
            k230_canmv_lckfb_defconfig
            k230_canmv_rtt_evb_defconfig
            k230_canmv_v3p0_defconfig
            k230_rtos_evb_defconfig
            k230_rtos_evb_spinand_defconfig
            k230_canmv_labplus_1956_defconfig
            k230d_canmv_atk_dnk230d_defconfig
            k230d_canmv_bpi_zero_defconfig
            k230d_canmv_junroc_ai_cam_defconfig
            k230d_canmv_labplus_ai_camera_defconfig
          )

          for UBOOT_DEFCONFIG in "${defconfigs[@]}"; do
            echo "=============================="
            echo " Building U-Boot: ${UBOOT_DEFCONFIG}"
            echo "=============================="

            make ${UBOOT_DEFCONFIG} || exit $?
            make uboot || exit $?

            # Also copy artifacts to artifacts folder
            cp ${{ github.workspace }}/output/${UBOOT_DEFCONFIG}/uboot/u-boot.bin ~/artifacts/${base_name}/u-boot.bin || echo "u-boot.bin missing"
            cp ${{ github.workspace }}/output/${UBOOT_DEFCONFIG}/uboot/spl/u-boot-spl.bin ~/artifacts/${base_name}/u-boot-spl.bin || echo "u-boot-spl.bin missing"
          done

          for UBOOT_DEFCONFIG in "${defconfigs[@]}"; do
            echo "=============================="
            echo " Building U-Boot With Fastboot: ${UBOOT_DEFCONFIG}"
            echo "=============================="

            echo "CONFIG_UBOOT_ENABLE_FAST_BOOT=y" >> ${{ github.workspace }}/rtos_sdk/configs/${UBOOT_DEFCONFIG}
            echo "CONFIG_UBOOT_FAST_BOOT_RTSMART=y" >> ${{ github.workspace }}/rtos_sdk/configs/${UBOOT_DEFCONFIG}
            make ${UBOOT_DEFCONFIG} || exit $?
            make uboot || exit $?

            cp ${{ github.workspace }}/output/${UBOOT_DEFCONFIG}/uboot/spl/u-boot-spl.bin ~/artifacts/${base_name}/u-boot-spl-fastboot.bin || echo "u-boot-spl.bin missing"; exit $?
          done

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/dev'
        with:
          name: "u-boot-prebuilt-${{ env.REVISION }}"
          path: ~/artifacts
          if-no-files-found: error
          compression-level: 0

      - name: Install Prebuilt u-boot
        if: github.ref != 'refs/heads/dev'
        run: |
          # Capture the U-Boot commit hash
          cd ${{ github.workspace }}/canmv_k230/src/uboot/uboot
          UBOOT_COMMIT=$(git rev-parse HEAD)

          # Install prebuilt artifacts into rtos_sdk/boards
          python3 .github/workflows/install_uboot_artifacts.py \
            --source ~/artifacts \
            --target ${{ github.workspace }}/rtos_sdk/boards

          # Commit the installed files to RTOS SDK
          cd ${{ github.workspace }}/rtos_sdk

          # Set up Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add boards
          git commit -m "Update prebuilt u-boot from https://github.com/canmv-k230/u-boot/commit/${UBOOT_COMMIT}"
          git status

          # Push using token-authenticated ssh
          # git remote set-url origin git@github.com:kendryte/k230_rtos_sdk.git
          # git push origin HEAD

      - name: Clean up SSH private key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
